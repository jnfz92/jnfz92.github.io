<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/navigation.css' | relative_url }}"><script src="{{ '/assets/navigation.js' | relative_url }}" defer></script></head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}"><span>FCE</span> English Lab</a>
      <nav aria-label="Navegación principal">
        <a href="{{ '/' | relative_url }}">Artículos</a>
        <a href="{{ '/#categories' | relative_url }}">Categorías</a>
        <a href="{{ '/#search' | relative_url }}">Buscar</a>
      </nav>
    </div>
  </header>
  <main>{{ content }}</main>
  <footer class="site-footer">
    <div class="wrap">
      <strong>FCE English Lab</strong>
      <p>Recursos prácticos para preparar Cambridge B2 First.</p>
    </div>
  </footer>
  <script src="{{ '/assets/search.js' | relative_url }}" defer></script>
</body>
</html>
