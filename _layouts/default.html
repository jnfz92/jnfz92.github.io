<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/navigation.css' | relative_url }}?v=20261017-unico2"><script src="{{ '/assets/navigation.js' | relative_url }}?v=20261017-unico2" defer></script></head>
<body>
  {% include header.html %}

  <main>{{ content }}</main>
  <footer class="site-footer">
    <div class="wrap">
      <strong>FCE English Lab</strong>
      <p>Recursos prácticos para preparar Cambridge B2 First.</p>
    </div>
  </footer>
  <script src="{{ '/assets/search.js' | relative_url }}" defer></script>

</html>
