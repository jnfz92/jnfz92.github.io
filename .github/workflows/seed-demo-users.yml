name: Seed demo users and messages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/seed-demo-users.mjs
      - .github/workflows/seed-demo-users.yml
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check protected admin key
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Secret SUPABASE_SERVICE_ROLE_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Create ten demo users with messages
        env:
          SUPABASE_URL: https://wnluofonzteaqtlfshgy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/seed-demo-users.mjs
