name: Escenarios funcionales Cucumber
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'
permissions:
  contents: read
jobs:
  bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Cucumber y navegador
        run: |
          npm install --no-save --no-package-lock @cucumber/cucumber@11.3.0 playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Ejecutar escenarios públicos descritos en español
        run: |
          mkdir -p cucumber-report
          npx cucumber-js --config cucumber.cjs
      - name: Publicar informe de escenarios, incluso si hay fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-cucumber-escenarios
          path: cucumber-report/
          if-no-files-found: warn
          retention-days: 14
