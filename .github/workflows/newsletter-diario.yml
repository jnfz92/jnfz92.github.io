name: Enviar newsletter diario
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEWSLETTER_CRON_SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}
    steps:
      - name: Comprobar configuracion
        id: configured
        shell: bash
        run: |
          if [[ -z "$NEWSLETTER_CRON_SECRET" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No se enviará nada hasta configurar NEWSLETTER_CRON_SECRET."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Enviar resumen (una vez por día y suscriptor)
        if: steps.configured.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --fail-with-body --silent --show-error --output /tmp/newsletter.json \
            --write-out '%{http_code}' --max-time 330 \
            -X POST 'https://wnluofonzteaqtlfshgy.supabase.co/functions/v1/newsletter' \
            -H 'Content-Type: application/json' \
            -H "x-newsletter-cron-secret: $NEWSLETTER_CRON_SECRET" \
            --data '{"action":"dispatch"}')
          echo "HTTP: $status"
          cat /tmp/newsletter.json
          if [[ "$status" != "200" ]]; then exit 1; fi
