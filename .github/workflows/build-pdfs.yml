name: Build downloadable PDFs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-pdfs.mjs
      - .github/workflows/build-pdfs.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/build-pdfs.mjs
      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdfs/*.pdf
          if git diff --cached --quiet; then
            echo "PDFs already up to date"
          else
            git commit -m "Build downloadable PDFs"
            git pull --rebase origin main
            git push
          fi
