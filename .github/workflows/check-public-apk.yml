name: Verify public Easy English download

on:
  push:
    paths:
      - ".github/workflows/check-public-apk.yml"
      - "index.html"
      - "_includes/header.html"
      - "assets/navigation.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-download:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check public APK and landing page without authentication
        shell: bash
        run: |
          set -euo pipefail
          APK="https://wnluofonzteaqtlfshgy.supabase.co/storage/v1/object/public/easy-english-downloads/EnglishAPK-v1.2.3.apk"
          echo "Comprobando descarga pública SIN token de GitHub o Supabase"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 75 -o /tmp/EnglishAPK.apk \
            -w "APK HTTP %{http_code} - bytes %{size_download} - final %{url_effective}\n" "$APK"
          test "$(stat -c '%s' /tmp/EnglishAPK.apk)" -gt 200000
          file /tmp/EnglishAPK.apk
          python3 - <<'PY'
          from pathlib import Path
          f=Path('/tmp/EnglishAPK.apk')
          assert f.read_bytes()[:2] == b'PK', 'No es un APK (ZIP) real'
          print('PASS: APK descargada sin credenciales: ',f.stat().st_size,'bytes')
          PY
          echo "Comprobando página pública"
          curl -fsSL --retry 2 -o /tmp/home.html \
            -w "Website HTTP %{http_code} - final %{url_effective}\n" \
            "https://jnfz92.github.io/"
          grep -q "Easy English" /tmp/home.html
          if grep -Fq "$APK" /tmp/home.html; then
            echo "PASS: botón público desplegado en portada"
          else
            echo "::warning::El archivo público funciona pero GitHub Pages aún no muestra el enlace actualizado"
          fi

      - name: Verify version 1.2.3 contains the real blue UI
        shell: bash
        run: |
          set -euo pipefail
          URL="https://wnluofonzteaqtlfshgy.supabase.co/storage/v1/object/public/easy-english-downloads/EnglishAPK-v1.2.3.apk"
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error -L --max-time 25 -o /tmp/easy-english-1.2.3.apk "$URL"; then break; fi
            if [ "$i" = 30 ]; then echo "::error::Falta la APK pública 1.2.3"; exit 1; fi
            sleep 10
          done
          echo "APK 1.2.3 pública:"
          sha256sum /tmp/easy-english-1.2.3.apk
          curl -fLSs --retry 3 \
            "https://jnfz92.github.io/assets/brand-system.css?v=20261031-unified-1" \
            -o /tmp/easy-english-web-brand.css
          python3 - <<'PY'
          import zipfile, re
          from pathlib import Path
          path='/tmp/easy-english-1.2.3.apk'
          with zipfile.ZipFile(path) as z:
              names=z.namelist()
              index=next((n for n in names if n.endswith('assets/www/index.html') or n == 'assets/www/index.html'), None)
              start=next((n for n in names if n.endswith('assets/www/start.html') or n == 'assets/www/start.html'), None)
              assert index and start, 'El APK no incluye las páginas que se esperaban'
              brand=next((n for n in names if n.endswith('assets/www/brand-system.css')), None)
              assert brand, 'La APK no incluye el sistema visual unificado'
              apk_css=z.read(brand)
              web_css=Path('/tmp/easy-english-web-brand.css').read_bytes()
              assert apk_css == web_css, 'El CSS empaquetado no coincide con el CSS público de la web'
              print('PASS: CSS del APK idéntico byte por byte al de Easy English web.')
              offline=z.read(index).decode('utf-8').lower()
              launcher=z.read(start).decode('utf-8').lower()
              assert '#1e5eff' in offline and '#173d87' in offline and '#f7f9fc' in offline
              assert '--ok:#2058b9' in offline
              assert '#1e5eff' in launcher
              for green in ['#0b8667','#e7f5ef','#e7f6f0','#bcf3d5','#f2f9f4','#e8f6ed','#4b9c70','#e6f7ef','#63bfa1','#dfece7']:
                  assert green not in offline, f'Verde heredado {green} sigue empaquetado en el APK'
              print('PASS: APK 1.2.3 real contiene el diseño azul y cero colores verdes heredados.')
          PY
