name: Quality checks
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/articulos-supabase.js'
      - 'assets/navigation.js'
      - 'assets/navigation-optimized.js'
      - 'assets/navigation-optimized.css'
      - 'assets/curso-supabase.js'
      - 'assets/continue-learning.js'
      - 'assets/aula-*.js'
      - 'assets/actividades.js'
      - 'assets/ee-ai.js'
      - 'assets/writing-ai.js'
      - 'assets/writing-editor.js'
      - 'assets/clave-openai.js'
      - '_includes/header.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/check_catalog.py'
      - '.github/workflows/site-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check catalog and navigation
        run: python3 scripts/check_catalog.py
      - name: Check JavaScript syntax for learning and AI features
        run: |
          node --check assets/actividades.js
          node --check assets/ee-ai.js
          node --check assets/writing-ai.js
          node --check assets/aula-ai-plan.js
          node --check assets/clave-openai.js
          node --check assets/writing-editor.js
