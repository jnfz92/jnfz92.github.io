name: One-time cleanup of merged feature branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-merged-branches.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-merged:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch full history to prove merge ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only previously verified, unchanged, fully merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          targets=(
          "cuaderno-errores-2026-10-17 0158038abc7d05d0b94839153c419dbc895bf9f6"
          "equilibrar-repaso-unificado-20261017 b3dbea490d3bb0885dd917d3f18bc408bd06036e"
          "examen-personalizado-fallos-20261017 5451f970afd39e12debff5bfc83bfdd7a89ffdd8"
          "motor-universal-actividades-20261017 0b3e97e31987beab57f5b4432660a9ba31b7e125"
          "recomendar-lectura-pendiente-20261017 4abc64f44305dfa1a5b755213e653817f9d9aae4"
          "retirar-historial-fallos-visible-20261017 d2e0e3f5d341f017d245e5e247506942a2ecdf1b"
          "retirar-importacion-progreso-antiguo-20261017 bee7da26bb2e64ff85fef738408814dc81255dfc"
          "unificar-menu-inferior-20261017 6fef5de89478d5c59de4566f79e92f608e1358be"
          "unificar-progreso-y-repaso-20261017 cd23ee0d2a098a922cf812140348f8ad96eaf979"
          )
          removed=0
          for entry in "${targets[@]}"; do
            read -r branch expected <<< "$entry"
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [[ "$actual" != "$expected" ]]; then
              echo "SKIP $branch: missing or updated"
              continue
            fi
            if ! git merge-base --is-ancestor "$expected" "$GITHUB_SHA"; then
              echo "SKIP $branch: contains commits not in main"
              continue
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "DELETED $branch"
            removed=$((removed + 1))
          done
          echo "Deleted $removed of 9 eligible branches."
