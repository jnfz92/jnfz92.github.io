<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Artículo trasladado · Easy English</title><link rel="stylesheet" href="/assets/site.css"></head><body class="ee-site"><main style="max-width:700px;margin:12vh auto;padding:24px"><h1>Estamos buscando tu artículo…</h1><p id="message">Si el artículo se ha trasladado a Supabase, te llevaremos a su nueva dirección.</p><p><a href="/articulos.html">Ver todos los artículos</a></p></main><script>
