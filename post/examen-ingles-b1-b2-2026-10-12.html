recordar una tarea pendiente.","Visit requiere otra estructura.","Visiting recuerda una experiencia pasada.","Visited no sigue directamente a remember."],"gerund-infinitive"],["I have ______ tried scuba diving. (Nunca)",["not never","yet","no","never"],3,["Doble negación incorrecta.","Yet no significa nunca aquí.","No no modifica el verbo así.","Never indica experiencia nunca vivida."],"present-perfect-never-yet"],["Have you sent the confirmation email ______?",["yet","never","still","already not"],0,["Yet al final pregunta por algo esperado.","Never cambiaría el significado.","Still no va normalmente al final aquí.","Already not es un orden incorrecto."],"present-perfect-never-yet"],["______ the journey was long, we enjoyed the trip.",["Despite","Although","In spite of","However"],1,["Despite necesita nombre o -ing.","Although introduce sujeto y verbo.","In spite of necesita nombre o -ing.","However requiere otra puntuación y estructura."],"linking-words-of-contrast"],["My brother prefers basketball, ______ I prefer football.",["despite","nevertheless","whereas","in spite of"],2,["Despite no une dos cláusulas así.","Nevertheless exige otra puntuación.","Whereas contrasta dos preferencias.","In spite of requiere nombre o -ing."],"linking-words-of-contrast"],["______ being nervous, she gave a great presentation.",["Although","Even though","Despite of","Despite"],3,["Although requiere una oración completa.","Even though requiere oración completa.","Despite of es incorrecto.","Despite + gerundio es correcto."],"linking-words-of-contrast"],["The taxi has stopped. Please ______ the car.",["get out of","get off","get up","get in"],0,["Get out of se usa para salir del coche.","Get off se usa para bus o tren.","Get up significa levantarse.","Get in significa entrar."],"get-phrasal-verbs"],["Your dentist appointment is confirmed for 10 tomorrow.",["I had seen my dentist at ten.","I'm seeing my dentist at ten.","I have seen my dentist at ten.","I was seeing my dentist at ten."],1,["Past Perfect refiere al pasado.","Present Continuous indica plan concertado.","Present Perfect no indica cita futura.","Past Continuous refiere al pasado."],"future-going-to-present-continuous"],["______ from houses can contaminate rivers. (Aguas residuales)",["Noise pollution","Renewable energy","Sewage","Emissions"],2,["Es contaminación acústica.","Es energía renovable.","Sewage significa aguas residuales.","Emissions son emisiones, no aguas residuales."],"pollution-environment-vocabulary"],["Don't leave ______ on the beach. (Basura tirada)",["recycling","landfill","renewable energy","litter"],3,["Recycling es reciclaje.","Landfill es vertedero.","Renewable energy es energía renovable.","Litter es basura tirada."],"pollution-environment-vocabulary"],["To find a specific date quickly, use ______.",["scanning","skimming","memorising everything","reading only the title"],0,["Scanning busca datos concretos.","Skimming capta la idea general.","Memorizar todo no es la técnica indicada.","El título no suele dar la fecha."],"skimming-scanning-reading"],["Choose the opposite of possible.",["unpossible","impossible","dispossible","mispossible"],1,["Unpossible no es forma estándar.","Impossible es el antónimo correcto.","Dispossible no existe en uso estándar.","Mispossible no es palabra estándar."],"negative-prefixes"],["The shop ______ tonight. (Posibilidad negativa)",["might not to open","might doesn't open","might not open","might not opens"],2,["Tras might no se usa to.","Might no combina con doesn't.","Might not + verbo base es correcto.","Tras might no se añade -s."],"modal-verb-might"],["Could you give me ______ information?",["several","a few","many","some"],3,["Several exige plural contable.","A few exige plural contable.","Many exige plural contable.","Some sirve con incontable information."],"countable-uncountable-nouns"]],key="easy-english-exam-2026-10-12",form=document.getElementById("exam");
