<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exámenes en línea · Easy English</title><style>body{margin:0;background:#f7f7f4;color:#17211c;font:16px/1.6 system-ui,sans-serif}header,main{max-width:840px;margin:auto;padding:20px}a{color:#1f5a49}.panel,fieldset{padding:20px;background:white;border:1px solid #dce5df;border-radius:14px;margin:16px 0}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:9px;border-radius:8px}button{background:#1f5a49;color:white;border:0;margin:7px 7px 7px 0;cursor:pointer}button:disabled{opacity:.55}legend{font-weight:700}.feedback{padding:12px;background:#e9f0ec;border-radius:8px;white-space:pre-wrap;margin:10px 0}#message{font-weight:700}</style></head><body><header><a href="examenes.html">← Todos los exámenes</a> · <a href="perfil.html">Mi perfil</a></header><main><h1>Exámenes con progreso guardado</h1><p>Inicia sesión para guardar tus notas en Supabase y consultarlas desde otros dispositivos.</p><section class="panel"><h2>Mi cuenta</h2><form id="login"><label>Correo electrónico <input id="email" type="email" required autocomplete="email"></label><label>Contraseña <input id="password" type="password" minlength="6" required autocomplete="current-password"></label><button>Iniciar sesión</button><button type="button" id="signup">Registrarme</button><button type="button" id="logout">Cerrar sesión</button></form><p id="session"></p></section><p id="message" role="status"></p><section class="panel"><h2>Elige un examen</h2><select id="examlist" aria-label="Exámenes"></select><button id="load" type="button">Empezar</button></section><form id="exam"></form><section class="panel"><h2>Mis resultados</h2><div id="history"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script>
const $=id=>document.getElementById(id);let questions=[],examId=null,submitting=false;const message=s=>$('message').textContent=s;const fail=e=>message('Error: '+(e?.message||String(e)));
async function refreshSession(){const {data:{user}}=await eeDb.auth.getUser();$('session').textContent=user?'Conectado: '+user.email:'No has iniciado sesión';await history()}
async function history(){const {data,error}=await eeDb.from('resultados').select('id,examen_id,aciertos,total,nota,fecha').order('fecha',{ascending:false}).limit(30);const box=$('history');box.replaceChildren();if(error){box.textContent='Inicia sesión para consultar tu historial.';return}if(!data.length){box.textContent='Todavía no tienes resultados guardados.';return}for(const r of data){const p=document.createElement('p');p.textContent=new Date(r.fecha).toLocaleString('es-ES')+' · Examen '+r.examen_id+' · '+r.aciertos+'/'+r.total+' ('+r.nota+'%)';box.append(p)}}
$('login').onsubmit=async e=>{e.preventDefault();const {error}=await eeDb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return fail(error);$('password').value='';message('Sesión iniciada');await refreshSession()};
$('signup').onclick=async()=>{const {data,error}=await eeDb.auth.signUp({email:$('email').value,password:$('password').value});if(error)return fail(error);message(data.session?'Registro completado.':'Revisa tu correo para confirmar tu cuenta.');await refreshSession()};
$('logout').onclick=async()=>{const {error}=await eeDb.auth.signOut();if(error)return fail(error);await refreshSession()};
async function list(){const {data,error}=await eeDb.from('examenes').select('id,titulo,fecha,nivel').order('fecha',{ascending:false});if(error)throw error;const sel=$('examlist');sel.replaceChildren();for(const ex of data){const option=document.createElement('option');option.value=ex.id;option.textContent=ex.fecha+' · '+ex.titulo+' ('+ex.nivel+')';sel.append(option)}if(!data.length)message('No hay exámenes. Ejecuta primero el SQL de Supabase.')}
async function load(){examId=Number($('examlist').value);if(!examId)return;const {data,error}=await eeDb.from('preguntas').select('id,orden,enunciado,opciones,fuente_url').eq('examen_id',examId).order('orden');if(error)throw error;questions=data;const form=$('exam');form.replaceChildren();for(const q of questions){const fs=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=q.orden+'. '+q.enunciado;fs.append(legend);q.opciones.forEach((op,i)=>{const label=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='question-'+q.id;input.value=i;label.append(input,document.createTextNode(' '+('ABCDEFGH'[i])+') '+op));fs.append(label)});if(q.fuente_url){const a=document.createElement('a');a.href=q.fuente_url;a.textContent='Repasar lección';fs.append(a)}const fb=document.createElement('div');fb.id='feedback-'+q.id;fb.className='feedback';fb.hidden=true;fs.append(fb);form.append(fs)}const submit=document.createElement('button');submit.type='submit';submit.textContent='Corregir y guardar resultado';form.append(submit);message('Examen cargado: '+questions.length+' preguntas.')}
$('load').onclick=()=>load().catch(fail);
$('exam').onsubmit=async e=>{e.preventDefault();if(submitting)return;submitting=true;const submit=$('exam').querySelector('button[type=submit]');submit.disabled=true;try{const responses={};for(const q of questions){const marked=$('exam').querySelector('input[name=question-'+q.id+']:checked');if(marked)responses[q.id]=Number(marked.value)}const {data,error}=await eeDb.rpc('entregar_examen',{p_examen_id:examId,p_respuestas:responses});if(error)throw error;const r=data[0],correction=await eeDb.rpc('ver_correccion',{p_resultado_id:r.resultado_id});if(correction.error)throw correction.error;const solutions=new Map(correction.data.map(s=>[String(s.pregunta_id),s]));for(const q of questions){const sol=solutions.get(String(q.id)),fb=$('feedback-'+q.id);fb.hidden=false;fb.textContent='Respuesta: '+('ABCDEFGH'[sol.respuesta_correcta])+') '+q.opciones[sol.respuesta_correcta]+'\n'+(sol.explicacion||'')}for(const input of $('exam').querySelectorAll('input'))input.disabled=true;message('Resultado guardado: '+r.aciertos+'/'+r.total+' · '+r.nota+'%');await history()}catch(error){submit.disabled=false;submitting=false;fail(error)}};
list().catch(fail);refreshSession().catch(fail);
</script></body></html>
