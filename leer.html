<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Lee artículos de Easy English desde Supabase."><title>Leer artículo · Easy English</title><link rel="stylesheet" href="assets/site.css?v=20261014"><style>main{max-width:950px;margin:32px auto;padding:0 16px}#notice{padding:18px;background:#eef5ef;border-radius:12px}#content{width:100%;border:0;min-height:80vh;display:block} .direct-link{margin:18px 0}iframe{background:white}</style></head><body class="ee-site ee-lesson"><header class="ee-header"><div class="ee-bar"><a class="ee-logo" href="index.html"><b aria-hidden="true">ee.</b>Easy English</a><nav class="ee-nav"><a href="articulos.html">Volver al blog</a></nav></div></header><main><p id="notice" role="status">Cargando artículo desde Supabase…</p><p class="direct-link" id="alternative" hidden></p><iframe id="content" title="Contenido del artículo" hidden></iframe></main><script>
(async()=>{const slug=new URLSearchParams(location.search).get('slug');const message=document.getElementById('notice'),frame=document.getElementById('content'),alt=document.getElementById('alternative');if(!slug||!/^[a-z0-9-]+$/.test(slug)){message.textContent='Artículo no válido.';return}const fallback='post/'+slug+'.html';const link=document.createElement('a');link.href=fallback;link.textContent='Abrir la versión HTML de respaldo';alt.append(link);try{const url='https://wnluofonzteaqtlfshgy.supabase.co/rest/v1/articulos?select=html,titulo&slug=eq.'+encodeURIComponent(slug)+'&limit=1';const r=await fetch(url,{headers:{apikey:'sb_publishable_Ef-AXAapcwaPExEFS6kmug_tKLaulM8',Accept:'application/json'}});if(!r.ok)throw Error('Supabase '+r.status);const data=await r.json();if(!data.length)throw Error('Artículo no encontrado');document.title=data[0].titulo;let html=data[0].html;html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+new URL('post/',location.href).href+'">');frame.srcdoc=html;frame.hidden=false;frame.addEventListener('load',()=>{try{const d=frame.contentDocument;if(d){frame.style.height=Math.max(d.documentElement.scrollHeight,d.body?.scrollHeight||0,600)+'px';new ResizeObserver(()=>{frame.style.height=Math.max(d.documentElement.scrollHeight,d.body?.scrollHeight||0,600)+'px'}).observe(d.body)}}catch(e){}},{once:true});message.textContent='Artículo cargado desde Supabase.';}catch(e){message.textContent='No se pudo cargar desde Supabase. Puedes abrir la versión de respaldo.';alt.hidden=false}})();
</script></body></html>
