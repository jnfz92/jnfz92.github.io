    const actions=el(doc,'div','ee-next-lesson-actions');

      const link=el(doc,'a','ee-next-primary','Siguiente lección →');

      actions.append(link);
    }
    const exam=el(doc,'a','','Practicar con exámenes');
    exam.href='/examenes.html';actions.append(exam);
    const library=el(doc,'a','','Volver a los artículos');
    library.href='/articulos.html';actions.append(library);
    next.append(actions);
    doc.querySelector('main').append(next);
  }
  doc.querySelector('main').append(comments);
  const commentsStyle=doc.createElement('link');
  commentsStyle.rel='stylesheet';
  commentsStyle.href='/assets/comentarios-articulos.css?v=20261030-unified-blue-2';
  doc.head.append(commentsStyle);
  function addScript(src){
   const script=doc.createElement('script');
   script.src=src;script.defer=true;doc.body.append(script);
  }
  // Carga secuencial: SDK de autenticación, configuración pública y cliente de comentarios.
  if(!doc.querySelector('script[src*="supabase-js"]'))addScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js');
  if(!doc.querySelector('script[src*="supabase-config.js"]'))addScript('/supabase-config.js');
  addScript('/assets/comentarios-articulos.js?v=20261104-auth-links-1');
  // Mantener el favicon en el documento sustituido con HTML de Supabase.
  const favicon=doc.createElement('link');favicon.rel='icon';favicon.type='image/svg+xml';favicon.href='/favicon.svg?v=20261030-blue-logo-2';doc.head.append(favicon);
  // La URL canónica y la descripción corresponden al artículo, no al cargador.
  const existing=doc.querySelector('link[rel="canonical"]');if(existing)existing.remove();
  const canonical=doc.createElement('link');canonical.rel='canonical';canonical.href=new URL('leer.html?slug='+encodeURIComponent(resolveSlug(slug)),location.href).href;doc.head.append(canonical);
  if(article.descripcion){let meta=doc.querySelector('meta[name="description"]');if(!meta){meta=doc.createElement('meta');meta.name='description';doc.head.append(meta)}meta.content=article.descripcion}
  // Mantener la cabecera, el menú, los eventos y la sesión: cambiar solo el contenido editorial.
  // La anterior sustitución de document.head/body reiniciaba la navegación en cada lectura.
  const articleLoadedMain=doc.querySelector('main');
  const loader=document.querySelector('main');
  if(!articleLoadedMain||!loader)throw Error('No se encontró el contenido principal de la lección');
  const oldTitle=document.title;
  document.title=article.titulo||oldTitle;
  document.documentElement.lang=doc.documentElement.lang||'es';
  document.body.classList.add('ee-site','ee-unified-article');
  for(const className of doc.body.classList)document.body.classList.add(className);

  const targetHead=document.head;
  // Los estilos editoriales específicos se instalan sin eliminar los estilos compartidos.
  const already=new Set([...targetHead.querySelectorAll('link[rel="stylesheet"]')].map(l=>new URL(l.href,location.href).pathname));
  for(const node of [...doc.head.querySelectorAll('link[rel="stylesheet"],style')]){
    if(node.tagName==='LINK'){
      const resolved=new URL(node.href,location.href);
      if(already.has(resolved.pathname))continue;
      already.add(resolved.pathname);
    }
    targetHead.append(document.importNode(node,true));
  }
  function stylesheet(path){
    if([...targetHead.querySelectorAll('link[rel="stylesheet"]')].some(l=>new URL(l.href,location.href).pathname===path.split('?')[0]))return;
    const link=document.createElement('link');link.rel='stylesheet';link.href=path;targetHead.append(link);
  }
  stylesheet('/assets/article-unified.css?v=20261108-article-layout-fix-1');
  stylesheet('/assets/comentarios-articulos.css?v=20261030-unified-blue-2');
  stylesheet('/assets/navigation-optimized.css?v=20261101-menu-6');

  const canonicalUrl=new URL('leer.html?slug='+encodeURIComponent(resolveSlug(slug)),location.href).href;
  let pageCanonical=document.head.querySelector('link[rel="canonical"]');
  if(!pageCanonical){pageCanonical=document.createElement('link');pageCanonical.rel='canonical';document.head.append(pageCanonical)}
  pageCanonical.href=canonicalUrl;
  if(article.descripcion){
    let meta=document.head.querySelector('meta[name="description"]');
    if(!meta){meta=document.createElement('meta');meta.name='description';document.head.append(meta)}
    meta.content=article.descripcion;
  }
  for(const [property,value] of [['og:type','article'],['og:title',article.titulo||document.title],
    ['og:description',article.descripcion||'Lección de inglés en Easy English'],['og:url',canonicalUrl]]){
    let tag=document.head.querySelector('meta[property="'+property+'"]');

    tag.content=value;
  }
  const schema=document.createElement('script');schema.type='application/ld+json';
  schema.textContent=JSON.stringify({'@context':'https://schema.org','@type':'LearningResource',

  document.head.append(schema);

  // El usuario conserva el mismo menú. Solo cambia el estado activo a Artículos.
  const nav=document.getElementById('ee-primary-navigation');
  if(nav){
    nav.querySelectorAll('[aria-current="page"]').forEach(link=>link.removeAttribute('aria-current'));
    const active=nav.querySelector('.ee-more-panel a[href="/articulos.html"]');
    if(active)active.setAttribute('aria-current','page');
    nav.querySelector('.ee-more > summary')?.classList.add('ee-more-current');
  }
  loader.replaceWith(document.importNode(articleLoadedMain,true));
  // Imágenes fuera de la zona inicial: carga diferida para ahorrar transferencia.
  document.querySelectorAll('main img').forEach((img,index)=>{
    img.decoding='async';
    if(index>0&&!img.hasAttribute('loading'))img.loading='lazy';
  });
  // Mantener scripts del artículo y los comentarios, sin volver a descargar navegación ni duplicar Supabase.
  const scripts=[...doc.querySelectorAll('script')].filter(s=>{
    const src=s.getAttribute('src')||'';
    return !/navigation(?:-optimized)?\.js|site\.js|supabase-js|supabase-config\.js/i.test(src)&&s.type!=='application/ld+json';
  });
  const activeExternal=new Set([...document.querySelectorAll('script[src]')].map(s=>new URL(s.src,location.href).pathname));
  const includesConfig=!!window.eeDb;
  const needed=includesConfig?[]:[
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
    '/supabase-config.js'
  ];
  const pending=[...needed,...scripts];
  for(const source of pending){
    const original=typeof source==='string'?null:source;
    const raw=original?.getAttribute('src')||(typeof source==='string'?source:'');
    if(raw&&activeExternal.has(new URL(raw,location.href).pathname))continue;
    const active=document.createElement('script');
    if(original)for(const attr of original.attributes){
      if(!['src','defer','async'].includes(attr.name))active.setAttribute(attr.name,attr.value);
    }
    if(raw){
      active.async=false;
      active.src=new URL(raw,location.href).href;
      activeExternal.add(new URL(active.src,location.href).pathname);
    }else if(original){
      active.textContent=original.textContent;
    }
    document.body.append(active);
  }
  window.dispatchEvent(new Event('easyenglish:article-rendered'));
 }catch(err){
  console.error('Error al mostrar el artículo',err);
  status.textContent='No se pudo cargar este artículo desde Supabase. Inténtalo de nuevo más tarde.';
 }
