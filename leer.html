<!doctype html>
<html lang="es"><head><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261017-ee"><meta name="theme-color" content="#005B3C"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>body{font-family:system-ui,sans-serif;background:#f7f7f4;color:#17211c;margin:0}.loader{max-width:720px;margin:12vh auto;padding:24px}.loader a{color:#176447}</style><link rel="stylesheet" href="/assets/navigation.css?v=20261017-menu-fix2"><script src="/assets/navigation.js?v=20261017-menu-fix2" defer></script></head>
<body>{% include header.html %}<main class="loader"><h1>Easy English</h1><p id="loading" role="status">Cargando el artículo desde Supabase…</p><p><a href="articulos.html">Volver al blog</a></p></main>
<script>
(async function(){
 const endpoint='https://wnluofonzteaqtlfshgy.supabase.co/rest/v1/';
 const key='sb_publishable_Ef-AXAapcwaPExEFS6kmug_tKLaulM8';
 const slug=new URLSearchParams(location.search).get('slug');
 const status=document.getElementById('loading');
 const aliases={'phrasal-verbs-with-get':'get-phrasal-verbs','agreeing-disagreeing':'polite-disagreement','expressing-opinions':'opinion-speculation-expressions','environment-vocabulary':'pollution-environment-vocabulary','adverbs-of-frequency':'todos-los-tiempos-de-presente-en-ingles','might':'modal-verb-might'};
 const resolveSlug=s=>aliases[s]||s;
 const headers={apikey:key,Accept:'application/json'};
 const baseURL=new URL('post/',location.href);
 function originalSlug(href){
  try{
   const u=new URL(href,baseURL);
   if(u.origin!==location.origin)return null;
   const match=u.pathname.match(/\/post\/(?:post\/)?([a-z0-9-]+)\.html$/i);
   return match?{slug:resolveSlug(match[1]),hash:u.hash}:null;
  }catch{return null}
 }
 async function loadJSON(query){
  const response=await fetch(endpoint+query,{headers});
  if(!response.ok)throw new Error('HTTP '+response.status);
  return response.json();
 }
 function el(doc,tag,cls,text){
  const node=doc.createElement(tag);
  if(cls)node.className=cls;
  if(text!==undefined)node.textContent=text;
  return node;
 }
 async function completeIndex(doc){
  const list=await loadJSON('articulos?select=slug,titulo,descripcion&order=titulo.asc&limit=1000');
  const used=new Set([slug]);
  for(const a of doc.querySelectorAll('section.section a.card[href]')){
   const found=originalSlug(a.getAttribute('href'));
   if(found)used.add(found.slug);
  }
  const extra=list.filter(a=>!used.has(a.slug));
  if(!extra.length)return;
  const section=el(doc,'section','section');
  section.id='mas-articulos';
  const top=el(doc,'div','section-top'),info=el(doc,'div');
  info.append(el(doc,'span','level','Nuevas lecciones'),el(doc,'h2','','Más artículos y exámenes'),el(doc,'p','','Materiales publicados después del índice original, todavía sin nivel verificado.'));
  top.append(info,el(doc,'span','count',extra.length+' contenidos'));section.append(top);
  const cards=el(doc,'div','cards');
  for(const item of extra){
   const card=el(doc,'a','card');card.href=new URL('leer.html?slug='+encodeURIComponent(item.slug),location.href).href;
   card.append(el(doc,'strong','',(item.titulo||item.slug).replace(/\s*[·|–-]\s*Easy English\s*$/i,'')),el(doc,'span','go','Abrir lección →'));
   cards.append(card);
  }
  section.append(cards);
  const final=doc.querySelector('main .end');
  if(final)final.before(section);
  else doc.querySelector('main')?.append(section);
  const jump=doc.querySelector('nav.jump');
  if(jump){const link=el(doc,'a','','Más artículos ('+extra.length+')');link.setAttribute('href','#mas-articulos');jump.append(link)}
 }
 if(!slug||!/^[a-z0-9-]+$/.test(slug)){status.textContent='El enlace no corresponde a un artículo válido.';return}
 try{
  const list=await loadJSON('articulos?select=html,titulo,descripcion&slug=eq.'+encodeURIComponent(resolveSlug(slug))+'&limit=1');
  if(!list.length||!list[0].html)throw new Error('Artículo no encontrado');
  const article=list[0];
  const doc=new DOMParser().parseFromString(article.html,'text/html');
  if(!doc.querySelector('main'))throw new Error('El contenido del artículo no incluye la sección principal');
  // Los artículos importados sin CSS necesitan el diseño editorial de Easy English.
  if(!doc.head.querySelector('link[rel="stylesheet"], style')){
    const style=doc.createElement('style');
    style.textContent=`
      :root{color-scheme:light}*{box-sizing:border-box}
      body{margin:0;background:#f3f6f1;color:#183428;font:16px/1.75 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-wrap:anywhere}
      main{width:min(100% - 32px,980px);margin:36px auto 80px}
      main>article{background:#fff;border:1px solid #e1e9e1;border-radius:24px;padding:clamp(22px,5vw,58px);box-shadow:0 12px 35px #1335220c}
      main>article>header{padding:0 0 25px;margin-bottom:32px;border-bottom:1px solid #e1e9e1;background:none}
      main>article h1{font-size:clamp(30px,5vw,48px);line-height:1.16;letter-spacing:-.04em;color:#14543c;margin:0 0 18px}
      main>article>header p{font-size:17px;color:#60736b;max-width:75ch}
      main>article h2{font-size:clamp(23px,3vw,30px);line-height:1.3;color:#176449;margin:38px 0 15px;letter-spacing:-.025em}
      main>article h3{font-size:19px;line-height:1.4;color:#185a43;margin:25px 0 10px}
      main>article p,main>article li{max-width:85ch}
      main>article section{border-top:1px solid #e7eee8;padding-top:12px;margin-top:22px}
      main>article table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;margin:24px 0 32px;font-size:15px}
      main>article th,main>article td{padding:12px 15px;border:1px solid #dce8df;text-align:left;white-space:normal}
      main>article th{background:#eaf5ee;color:#14543c;font-weight:800}
      main>article tbody tr:nth-child(even){background:#f7faf8}
      main>article strong{color:#14543c}
      main>article a{color:#176449;text-decoration:underline}
      .ee-comments{margin-top:30px}
      @media(max-width:600px){main{width:min(100% - 20px,980px);margin:18px auto 60px}main>article{border-radius:18px;padding:20px 17px}main>article th,main>article td{padding:9px 10px;font-size:13px}}
    `;
    doc.head.append(style);
  }
  // El HTML del artículo se presenta como documento completo; no hay iframe ni dos cabeceras.
  const base=doc.createElement('base');base.href=baseURL.href;doc.head.prepend(base);
  if(slug==='indice-de-dificultad')await completeIndex(doc);
  for(const link of doc.querySelectorAll('a[href]')){
   const value=link.getAttribute('href');
   if(!value)continue;
   if(value[0]==='#'){link.href=location.origin+location.pathname+location.search+value;continue}
   if(/^(mailto:|tel:|javascript:)/i.test(value))continue;
   const found=originalSlug(value);
   if(found)link.href=new URL('leer.html?slug='+encodeURIComponent(found.slug)+found.hash,location.href).href;
  }
  // Comentarios por hilos disponibles en los 145 artículos, sin alterar su HTML de origen.
  const comments=doc.createElement('section');
  comments.id='comentarios';
  comments.className='ee-comments';
  comments.dataset.articleSlug=resolveSlug(slug);
  comments.setAttribute('aria-labelledby','ee-comments-title');
  const commentsHeading=el(doc,'h2','','Comentarios y respuestas');
  commentsHeading.id='ee-comments-title';
  comments.append(
   commentsHeading,
   el(doc,'p','ee-comments-intro','Pregunta, comparte una idea o responde a otros estudiantes. Las respuestas a respuestas quedan dentro del mismo hilo.'),
   el(doc,'div','ee-comments-composer')
  );
  // IDs exclusivos: los scripts usan estos contenedores después de cargar la lección.
  comments.lastChild.id='ee-comments-composer';
  const commentCount=el(doc,'p','ee-comments-count','');
  commentCount.id='ee-comments-count';
  const commentStatus=el(doc,'p','ee-comments-status','Cargando comentarios…');
  commentStatus.id='ee-comments-status';
  commentStatus.setAttribute('role','status');
  commentStatus.setAttribute('aria-live','polite');
  const commentList=el(doc,'div','ee-comments-list');
  commentList.id='ee-comments-list';
  comments.append(commentCount,commentStatus,commentList);
  doc.querySelector('main').append(comments);
  const commentsStyle=doc.createElement('link');
  commentsStyle.rel='stylesheet';
  commentsStyle.href='/assets/comentarios-articulos.css?v=20261018';
  doc.head.append(commentsStyle);
  function addScript(src){
   const script=doc.createElement('script');
   script.src=src;script.defer=true;doc.body.append(script);
  }
  // Carga secuencial: SDK de autenticación, configuración pública y cliente de comentarios.
  if(!doc.querySelector('script[src*="supabase-js"]'))addScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js');
  if(!doc.querySelector('script[src*="supabase-config.js"]'))addScript('/supabase-config.js');
  addScript('/assets/comentarios-articulos.js?v=20261018');
  // Mantener el favicon en el documento sustituido con HTML de Supabase.
  const favicon=doc.createElement('link');favicon.rel='icon';favicon.type='image/svg+xml';favicon.href='/favicon.svg?v=20261017-ee';doc.head.append(favicon);
  // La URL canónica y la descripción corresponden al artículo, no al cargador.
  const existing=doc.querySelector('link[rel="canonical"]');if(existing)existing.remove();
  const canonical=doc.createElement('link');canonical.rel='canonical';canonical.href=new URL('leer.html?slug='+encodeURIComponent(resolveSlug(slug)),location.href).href;doc.head.append(canonical);
  if(article.descripcion){let meta=doc.querySelector('meta[name="description"]');if(!meta){meta=doc.createElement('meta');meta.name='description';doc.head.append(meta)}meta.content=article.descripcion}
  // El header del lector también se obtiene del único include Jekyll del cargador.
  // Reemplaza el header editorial que venga en el HTML de Supabase.
  const sharedHeader=document.getElementById('ee-shared-header');
  const originalArticleHeader=doc.querySelector('body > header.ee-header, body > header.site-header');
  if(sharedHeader){
    const headerCopy=sharedHeader.cloneNode(true);
    if(originalArticleHeader) originalArticleHeader.replaceWith(headerCopy);
    else doc.body.prepend(headerCopy);
  }
  // El articulo llega como documento HTML completo desde Supabase.
  // Cargar tambien la barra de navegacion en el documento sustituido.
  const navStyle=doc.createElement('link');navStyle.rel='stylesheet';
  navStyle.href=new URL('/assets/navigation.css?v=20261017-menu-fix2',location.href).href;
  doc.head.append(navStyle);
  const navScript=doc.createElement('script');
  navScript.src=new URL('/assets/navigation.js?v=20261017-menu-fix2',location.href).href;
  navScript.defer=true;doc.body.append(navScript);
  document.open();
  document.write('<!doctype html>\n'+doc.documentElement.outerHTML);
  document.close();
 }catch(err){
  console.error('Error al mostrar el artículo',err);
  status.textContent='No se pudo cargar este artículo desde Supabase. Inténtalo de nuevo más tarde.';
 }
})();
</script></body></html>
