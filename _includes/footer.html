{% comment %}Footer único de Easy English: mismos estilos en todas las páginas, incluida la portada.{% endcomment %}
<style>
/* Estilos encapsulados: evitan diferencias entre index, perfil y las demás páginas. */
html body.ee-site > footer.ee-footer {
  box-sizing:border-box !important;
  display:block !important;
  width:100% !important;
  max-width:none !important;
  min-width:0 !important;
  clear:both !important;
  float:none !important;
  position:relative !important;
  margin:0 !important;
  padding:42px 28px !important;
  border:0 !important;
  border-top:1px solid #d9e4ff !important;
  border-radius:0 !important;
  background:#ebedf2 !important;
  color:#667085 !important;
  box-shadow:none !important;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif !important;
  font-size:13px !important;
  font-weight:400 !important;
  line-height:1.6 !important;
  text-align:left !important;
  text-transform:none !important;
  letter-spacing:normal !important;
}
html body.ee-site > footer.ee-footer > p {
  box-sizing:border-box !important;
  display:block !important;
  width:100% !important;
  max-width:1140px !important;
  margin:4px auto !important;
  padding:0 !important;
  border:0 !important;
  background:transparent !important;
  color:inherit !important;
  font:inherit !important;
  text-align:left !important;
  letter-spacing:normal !important;
}
@media (max-width:640px) {
  html body.ee-site > footer.ee-footer {padding:30px 20px !important;}
}
</style>
<footer class="ee-footer" aria-label="Pie de página de Easy English">
  <p>Un poco de inglés. Un paso más cada día.</p>
</footer>
